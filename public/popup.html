<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTub.ext — YouTube Extension</title>
    <meta name="description" content="More control. Better YouTube. Customize intro and outro skipping and automatically confirm the continue-watching popup.">
    <link rel="stylesheet" href="assets/popup.css">
    <script src="main.js" defer></script>
  </head>
  <body>
    <header>
      <div class="identity"><img src="assets/logo.svg" width="52" height="34" alt=""><div class="brand"><h1>YouTub.ext</h1><p>More control. Better YouTube.</p></div></div>
      <div class="theme-tabs" role="group" aria-label="Appearance">
        <button type="button" data-theme="system" aria-label="System theme" title="System" aria-pressed="true"><svg width="16" height="16" aria-hidden="true"><use href="assets/icons.svg#system"></use></svg></button>
        <button type="button" data-theme="light" aria-label="Light theme" title="Light" aria-pressed="false"><svg width="16" height="16" aria-hidden="true"><use href="assets/icons.svg#light"></use></svg></button>
        <button type="button" data-theme="dark" aria-label="Dark theme" title="Dark" aria-pressed="false"><svg width="16" height="16" aria-hidden="true"><use href="assets/icons.svg#dark"></use></svg></button>
      </div>
    </header>
    <main>
      <section data-section="intro" aria-labelledby="intro-heading">
        <div class="section-title"><div><h2 id="intro-heading">Intro</h2><p>Skip the first seconds</p></div><label class="switch"><input type="checkbox" aria-label="Enable intro skipping"><span></span></label></div>
        <div class="presets" role="group" aria-label="Intro duration"></div>
        <form hidden><label>Custom seconds<span class="number-control"><input type="number" min="1" max="86400" step="1" required inputmode="numeric"><span class="stepper"><button type="button" data-step="up" aria-label="Increase seconds"><span></span></button><button type="button" data-step="down" aria-label="Decrease seconds"><span></span></button></span></span></label><button type="button" data-cancel>Cancel</button><button type="submit">Save</button></form>
      </section>
      <section data-section="outro" aria-labelledby="outro-heading">
        <div class="section-title"><div><h2 id="outro-heading">Outro</h2><p>Skip the final seconds</p></div><label class="switch"><input type="checkbox" aria-label="Enable outro skipping"><span></span></label></div>
        <div class="presets" role="group" aria-label="Outro duration"></div>
        <form hidden><label>Custom seconds<span class="number-control"><input type="number" min="1" max="86400" step="1" required inputmode="numeric"><span class="stepper"><button type="button" data-step="up" aria-label="Increase seconds"><span></span></button><button type="button" data-step="down" aria-label="Decrease seconds"><span></span></button></span></span></label><button type="button" data-cancel>Cancel</button><button type="submit">Save</button></form>
      </section>
      <div class="nonstop"><div><h2 id="nonstop-heading">Non stop playing</h2><p id="nonstop-description">Auto-confirm “Continue watching?”</p></div><label class="switch"><input id="nonstop" type="checkbox" role="switch" aria-labelledby="nonstop-heading" aria-describedby="nonstop-description" checked><span></span></label></div>
    </main>
    <footer><a id="github" href="https://github.com/sectect/youtub.ext" target="_blank" rel="noopener noreferrer" aria-label="Star YouTub.ext on GitHub (new tab)" title="Star on GitHub"><svg width="16" height="16" aria-hidden="true"><use href="assets/icons.svg#github"></use></svg><span>Star on GitHub</span></a><p id="status" role="status" aria-live="polite">Applies to YouTube videos</p></footer>
  </body>
</html>
