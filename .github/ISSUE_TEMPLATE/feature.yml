name: Feature request
description: Propose a focused improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the use case and what is missing.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior and any alternatives considered.
    validations:
      required: true
