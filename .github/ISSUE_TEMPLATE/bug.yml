name: Bug report
description: Report unexpected behavior.
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Extension version, browser version, and operating system.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include relevant settings and a public video URL if useful. Do not include private information.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Add screenshots or console errors if available.
    validations:
      required: true
